    <script> /*-------------------------< HOVER TEXT >----------------------*/
        const hover_ele = document.getElementById('cursormessage');
        var sanity = 0;
        let is_message_displayed = false;

        var cursor_pos = [0, 0];

        
        addEventListener('mousemove', e => {
            cursor_pos = [e.x, e.y];
        })

        function upd_message_pos() {
            hover_ele.style.top = `${cursor_pos[1] + scrollY}px`;
            hover_ele.style.left = `${cursor_pos[0] + scrollX}px`;
        }
    
        function invoke_message(text, length=2000) {
            sanity += 1;
            let cs = sanity;

            is_message_displayed = true;

            upd_message_pos();
            hover_ele.innerText = text;
            hover_ele.style.display = 'block';

            setTimeout(() => {
                if (sanity === cs) {
                    hover_ele.style.display = 'none';
                    is_message_displayed = false;
                    sanity = 0;
                }
            }, length);
        }

        function frame() {
            if (is_message_displayed) {
                upd_message_pos();
            }
            requestAnimationFrame(frame);
        }
        frame();
    </script>

    <script> /*-------------------< COPY TEXT >------------------------*/
        function copy_text(text) {
            navigator.clipboard.writeText(text).then(()=>{
                invoke_message(`copied to clipboard!${sanity === 0 ? '' : ' (x'+(sanity+1)+')'}`)
            });
        }
    </script>
